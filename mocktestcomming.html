<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link class="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Exam Mock Test Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #121212, #1a1a1a); 
            color: #e0e0e0; 
            margin: 0; 
            padding: 20px 15px 90px 15px; 
            display: flex;
            flex-direction: column;
            height: 100%;
            position: fixed;
            width: 100%;
            overflow: hidden; 
        }
        .header { 
            background: rgba(30, 30, 30, 0.8); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            flex-shrink: 0; 
        }
        .header h2 { margin: 0 0 5px 0; font-size: 20px; color: #2ecc71; letter-spacing: 0.5px; }
        .header p { margin: 0; font-size: 13px; color: #b0b0b0; }
        
        .tabs { 
            display: flex; 
            gap: 10px; 
            padding-bottom: 10px; 
            margin-bottom: 5px; 
            overflow-x: auto; 
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0; 
        }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: #a0a0a0; 
            font-size: 13px; 
            font-weight: 600; 
            padding: 8px 16px; 
            cursor: pointer; 
            white-space: nowrap; 
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .tab.active { 
            color: #fff; 
            background: #2ecc71;
            border-color: #2ecc71;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }

        .scroll-hint {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-bottom: 12px;
            font-weight: 500;
            animation: pulse 2s infinite;
            flex-shrink: 0; 
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        
        .list-container-wrapper { 
            flex: 1; 
            overflow-y: auto; 
            padding-bottom: 20px; 
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        
        .list-container-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .list-container-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        /* ফোল্ডার লিস্ট আইটেম */
        .list-item { 
            background: rgba(30, 30, 30, 0.7); 
            padding: 14px 16px; 
            border-radius: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.05); 
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        .list-item:hover { 
            background: rgba(45, 45, 45, 0.8); 
            border-color: rgba(46, 204, 113, 0.4);
        }
        .list-item span { font-size: 15px; font-weight: 600; }
        
        /* ⚡ ন্যারো ও কম্প্যাক্ট ফাইনাল টেস্ট কার্ড ডিজাইন */
        .test-item-card {
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: rgba(32, 32, 32, 0.85); 
            padding: 10px 14px; 
            margin-bottom: 8px; 
            border-radius: 8px; 
            border-left: 4px solid #2ecc71; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.02);
            border-right: 1px solid rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .test-info-box h3 { 
            margin: 0; 
            font-size: 14px; 
            color: #fff; 
            font-weight: 600; 
        }
        .test-meta-text { 
            margin: 3px 0 0 0; 
            font-size: 11px; 
            color: #999; 
        }
        .test-meta-text strong { color: #2ecc71; }

        /* ন্যারো স্টার্ট বাটন */
        .btn-test-action {
            color: white; 
            border: none; 
            padding: 6px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 12px; 
            transition: all 0.2s;
        }
        .btn-start-active {
            background: linear-gradient(135deg, #2ecc71, #27ae60); 
            box-shadow: 0 2px 6px rgba(46, 204, 113, 0.2);
        }
        .btn-start-active:hover { transform: translateY(-1px); }
        .btn-start-disabled {
            background: #333; 
            color: #666; 
            cursor: not-allowed;
        }
        
        .back-btn { 
            background: rgba(255,255,255,0.1); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 6px 14px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 600; 
            align-self: flex-start; 
            margin-bottom: 12px; 
            font-size: 12px; 
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(20, 20, 20, 0.95); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 10px 0; 
            border-top: 1px solid rgba(255,255,255,0.05); 
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6); 
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #777; 
            text-decoration: none; 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            background: none; 
            border: none; 
            padding: 5px; 
        }
        .nav-item.active { color: #2ecc71; }
        .nav-icon { font-size: 20px; margin-bottom: 3px; }
    </style>
    <style id="pwa-global-fix">
        html {
        overscroll-behavior: none !important;
        overscroll-behavior-y: none !important;
        height: 100%;
        overflow: hidden;
    }
    body {
        overscroll-behavior: none !important;
        overscroll-behavior-y: none !important;
        touch-action: pan-x pan-y;
        position: fixed;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    </style>
    <script>
    // PWA: Prevent pull-to-refresh globally
    (function() {
        var lastY = 0;
        document.addEventListener('touchstart', function(e) {
            lastY = e.touches[0].clientY;
        }, { passive: true });
        document.addEventListener('touchmove', function(e) {
            var y = e.touches[0].clientY;
            var scrollable = e.target.closest('.content-area, .grid-content, #instruction-screen, .tab-content, .scrollable, .list-container-wrapper, [style*="overflow"]');
            if (!scrollable) {
                e.preventDefault();
                return;
            }
            if (scrollable.scrollTop === 0 && y > lastY) {
                e.preventDefault();
            }
            lastY = y;
        }, { passive: false });
    })();
    </script>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoBw6-MTBXtIJPEvP9qB7I3JFpJ7MZM5I",
            authDomain: "mocktest0.firebaseapp.com",
            projectId: "mocktest0",
            storageBucket: "mocktest0.firebasestorage.app",
            messagingSenderId: "251833325363",
            appId: "1:251833325363:web:8bdd09a4b717bf045e9046",
            measurementId: "G-6P2P3WS42H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({
                tabManager: persistentMultipleTabManager()
            })
        });

        const urlParams = new URLSearchParams(window.location.search);
        const currentExamKey = urlParams.get('exam');

        (function renderInstantly() {
            if (!currentExamKey) {
                document.getElementById('main-tabs').style.display = 'none'; 
                document.getElementById('scroll-hint-element').style.display = 'none'; 
                document.getElementById('exam-title').innerText = "আপনার কেনা এক্সাম সমূহ"; 
                if (document.getElementById('exam-desc')) {
                    document.getElementById('exam-desc').innerText = "যে ক্যাটাগরিগুলো আপনি কিনেছেন, সেগুলো নিচে দেওয়া হলো।"; 
                }

                let lastUserUid = null;
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('user_data_')) {
                        lastUserUid = key.replace('user_data_', '');
                        break;
                    }
                }
                if (lastUserUid) {
                    const cachedData = localStorage.getItem(`user_data_${lastUserUid}`);
                    if (cachedData) {
                        const userData = JSON.parse(cachedData);
                        if (window.renderPurchasedExamsList) {
                            window.renderPurchasedExamsList(userData);
                        }
                    }
                }
            }
        })();

        onAuthStateChanged(auth, async (user) => {
            if (!user) { 
                window.location.href = "login.html"; 
            } else {
                if (currentExamKey) {
                    initTestPortal();
                } else {
                    document.getElementById('main-tabs').style.display = 'none'; 
                    document.getElementById('scroll-hint-element').style.display = 'none';
                    document.getElementById('exam-title').innerText = "আপনার কেনা এক্সাম সমূহ"; 
                    if (document.getElementById('exam-desc')) {
                        document.getElementById('exam-desc').innerText = "যে ক্যাটাগরিগুলো আপনি কিনেছেন, সেগুলো নিচে দেওয়া হলো।"; 
                    }
                    showPurchasedExams(user.uid); 
                }
            }
        });

        async function showPurchasedExams(uid) {
            const container = document.getElementById('list-container'); 
            if (container.children.length === 0) {
                container.innerHTML = '<p style="color:#aaa; padding:15px;">আপনার প্রোফাইল চেক করা হচ্ছে...</p>'; 
            }
            
            try {
                const userDoc = await getDoc(doc(db, "users", uid)); 
                if (userDoc.exists()) {
                    const userData = userDoc.data(); 
                    localStorage.setItem(`user_data_${uid}`, JSON.stringify(userData)); 
                    if (window.renderPurchasedExamsList) {
                        window.renderPurchasedExamsList(userData);
                    }
                }
            } catch(e) {
                console.error(e);
                if (container.children.length === 0) {
                    container.innerHTML = '<p style="color:#aaa; padding:15px;">লোডিং ত্রুটি হয়েছে।</p>';
                }
            }
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            if(confirm("আপনি কি নিশ্চিতভাবে লগআউট করতে চান?")) {
                localStorage.clear();
                sessionStorage.clear();
                signOut(auth).then(() => { window.location.href = "login.html"; }); 
            }
        });

        window.initTestPortal = initTestPortal;
    </script>

    <script>
        let data = null; 
        let navStack = []; 
        let currentCategoryGlobal = 'mock';

        window.renderPurchasedExamsList = function(userData) {
            const container = document.getElementById('list-container'); 
            container.innerHTML = ''; 

            const examNames = {
                "wb_police": "👮 WB Police Premium Course", 
                "wbpsc": "🏛️ WBPSC Premium Course", 
                "railway": "🚂 Railway Premium Course" 
            };

            let hasPurchased = false;

            if (userData && userData.purchasedExams) {
                Object.keys(userData.purchasedExams).forEach(examKey => {
                    if (userData.purchasedExams[examKey] === true) {
                        hasPurchased = true;
                        const item = document.createElement('div'); 
                        item.className = 'list-item'; 
                        item.innerHTML = `<span>${examNames[examKey] || examKey} (Unlocked)</span><span style="color:#2ecc71;">প্রবেশ করুন ➔</span>`; 
                        item.onclick = () => {
                            window.location.href = `mocktestcomming.html?exam=${examKey}`; 
                        };
                        container.appendChild(item); 
                    }
                });
            }

            if (!hasPurchased) {
                container.innerHTML = '<p style="color:#aaa; padding:15px;">আপনি এখনো কোনো এক্সাম ক্যাটাগরি কেনেননি। ড্যাশবোর্ড থেকে পছন্দমতো ক্যাটাগরি কিনতে পারেন।</p>'; 
            }
        };

        async function initTestPortal() {
            const urlParams = new URLSearchParams(window.location.search); 
            const currentExamKey = urlParams.get('exam'); 
            const container = document.getElementById('list-container'); 

            const examNames = {
                "wb_police": "WB Police Mock Test", 
                "wbpsc": "WBPSC Mock Test Portal", 
                "railway": "Railway Mock Test", 
                "free_test": "Free Test Mock Test Portal" 
            };
            
            document.getElementById('exam-title').innerText = examNames[currentExamKey] || "Online Mock Test"; 

            const cachedJSON = localStorage.getItem(`cache_json_${currentExamKey}`);
            if (cachedJSON) {
                try {
                    data = JSON.parse(cachedJSON);
                    
                    // চেক করা হচ্ছে ব্যাক বাটন দিয়ে আসার পর কোনো সেভ করা স্টেট আছে কি না
                    const savedStateStr = sessionStorage.getItem(`saved_nav_${currentExamKey}`);
                    if (savedStateStr) {
                        const savedState = JSON.parse(savedStateStr);
                        currentCategoryGlobal = savedState.category || 'mock';
                        navStack = savedState.navStack || [];
                        
                        // সঠিক ট্যাব হাইলাইট করা
                        const activeTabBtn = document.getElementById(`tab-${currentCategoryGlobal}`);
                        loadList(currentCategoryGlobal, activeTabBtn, false);
                    } else {
                        loadList('mock', document.getElementById('tab-mock'), false);
                    }
                } catch(e) { console.error(e); }
            } else {
                container.innerHTML = '<p style="color:#aaa; padding:15px;">মক টেস্টের ডেটা লোড হচ্ছে...</p>';
            }

            try {
                const response = await fetch(`./data/${currentExamKey}.json`);
                if (!response.ok) throw new Error("JSON file could not be fetched.");

                const freshData = await response.json(); 

                if (JSON.stringify(data) !== JSON.stringify(freshData)) {
                    data = freshData;
                    localStorage.setItem(`cache_json_${currentExamKey}`, JSON.stringify(freshData));
                    
                    const savedStateStr = sessionStorage.getItem(`saved_nav_${currentExamKey}`);
                    if (savedStateStr) {
                        const savedState = JSON.parse(savedStateStr);
                        currentCategoryGlobal = savedState.category || 'mock';
                        navStack = savedState.navStack || [];
                        const activeTabBtn = document.getElementById(`tab-${currentCategoryGlobal}`);
                        loadList(currentCategoryGlobal, activeTabBtn, false); 
                    } else {
                        loadList('mock', document.getElementById('tab-mock'), false); 
                    }
                }

            } catch (error) {
                console.error("Error loading JSON data: ", error);
                if (!data) {
                    container.innerHTML = '<p style="color:#e74c3c; padding:15px;">দুঃখিত, মক টেস্টের ডেটা লোড করা যায়নি।</p>';
                }
            }
        }

        function loadList(categoryType, tabElement, pushToHistory = true) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); 
            if(tabElement) tabElement.classList.add('active'); 

            // যদি একদম নতুন ট্যাবে ক্লিক করা হয় (স্টেট রিস্টোরেশন ছাড়া), তবে স্ট্যাক খালি করা হবে
            if (pushToHistory) {
                currentCategoryGlobal = categoryType;
                navStack = []; 
                history.pushState({ category: currentCategoryGlobal, depth: 0 }, "");
                
                const urlParams = new URLSearchParams(window.location.search);
                const currentExamKey = urlParams.get('exam');
                if (currentExamKey) {
                    sessionStorage.setItem(`saved_nav_${currentExamKey}`, JSON.stringify({ category: currentCategoryGlobal, navStack: navStack }));
                }
            }
            renderCurrentFolderLevel();
        }

        function renderCurrentFolderLevel() {
            const wrapper = document.querySelector('.list-container-wrapper');
            if(wrapper) wrapper.scrollTop = 0;

            const container = document.getElementById('list-container'); 
            container.innerHTML = ''; 
            
            if(!data) {
                container.innerHTML = '<p style="color:#aaa; padding:15px;">এই ক্যাটাগরিতে কোনো ডেটা খুঁজে পাওয়া যায়নি।</p>';
                return; 
            }

            if (navStack.length > 0) {
                const backBtn = document.createElement('button'); 
                backBtn.className = 'back-btn'; 
                backBtn.textContent = '← Back'; 
                backBtn.onclick = () => {
                    history.back();
                }; 
                container.appendChild(backBtn); 
            }
            
            let currentDataContext = data[currentCategoryGlobal] || data[currentCategoryGlobal.toUpperCase()] || data[currentCategoryGlobal.toLowerCase()];
            
            if (navStack.length > 0) {
                currentDataContext = navStack[navStack.length - 1].folderData;
            }

            if (!currentDataContext || Object.keys(currentDataContext).length === 0) {
                container.innerHTML += '<p style="color:#aaa; padding:15px;">আপাতত কোনো টেস্ট উপলব্ধ নেই।</p>'; 
                return;
            }

            if (Array.isArray(currentDataContext)) {
                currentDataContext.forEach(mockObject => { 
                    renderFinalTestItem(mockObject); 
                }); 
            } else {
                Object.keys(currentDataContext).forEach(keyName => {
                    renderCategoryItem(keyName, () => {
                        navStack.push({ name: keyName, folderData: currentDataContext[keyName] });
                        
                        history.pushState({ 
                            category: currentCategoryGlobal, 
                            depth: navStack.length 
                        }, "");

                        const urlParams = new URLSearchParams(window.location.search);
                        const currentExamKey = urlParams.get('exam');
                        if (currentExamKey) {
                            sessionStorage.setItem(`saved_nav_${currentExamKey}`, JSON.stringify({ category: currentCategoryGlobal, navStack: navStack }));
                        }

                        renderCurrentFolderLevel();
                    });
                });
            }
        }

        function renderCategoryItem(title, onClickAction) {
            const container = document.getElementById('list-container'); 
            const item = document.createElement('div'); 
            item.className = 'list-item'; 
            item.innerHTML = `<span>📁 ${title}</span><span style="color:#2ecc71; font-weight: bold;">➔</span>`; 
            item.onclick = onClickAction; 
            container.appendChild(item); 
        }

        function renderFinalTestItem(mockObject) {
            const container = document.getElementById('list-container'); 
            const itemCard = document.createElement('div');
            itemCard.className = 'test-item-card';
            
            const linkStr = mockObject.link ? mockObject.link.trim() : "";
            const linkLower = linkStr.toLowerCase();
            
            let isComingSoon = !linkStr || linkLower === "" || linkLower === "coming soon";
            
            if (linkLower.includes("mocktestformat.html") && !linkLower.includes("testfile=")) {
                isComingSoon = true;
            }
            
            const testParam = linkStr.split('testfile=')[1] || "default_test";
            const pauseKeyToCheck = "mock_test_time_" + testParam + "_paused";
            const isExamPaused = localStorage.getItem(pauseKeyToCheck) === "true";

            const fMarks = mockObject.full_marks || mockObject.totalQ || 0;
            const nMarking = mockObject.negative_marking || 0.25;
            const tQ = mockObject.totalQ || 0;
            const tTime = encodeURIComponent(mockObject.time || '');
            const baseLink = mockObject.link ? mockObject.link.trim() : "";
            const separator = baseLink.includes('?') ? '&' : '?';
            const finalLink = `${baseLink}${separator}marks=${fMarks}&neg=${nMarking}&q=${tQ}&timeStr=${tTime}&testName=${encodeURIComponent(mockObject.name)}`;

            let buttonHtml = "";

            if (isComingSoon) {
                buttonHtml = `<button class="btn-test-action btn-start-disabled" disabled>🔒 Coming</button>`;
            } else if (isExamPaused) {
                buttonHtml = `<button class="btn-test-action" style="background-color: #fdd663; color: #000;" onclick="window.location.href='${finalLink}'">⏸️ Resume</button>`;
            } else {
                buttonHtml = `<button class="btn-test-action btn-start-active" onclick="window.location.href='${finalLink}'">Start</button>`;
            }

            itemCard.innerHTML = `
                <div class="test-info-box">
                    <h3>${mockObject.name}</h3>
                    <p class="test-meta-text">
                        ⏳ সময়: <strong>${mockObject.time || 'N/A'}</strong> | 📝 প্রশ্ন: <strong>${mockObject.totalQ || 'N/A'}</strong> টি
                    </p>
                </div>
                ${buttonHtml}
            `;

            container.appendChild(itemCard);
        }

        window.addEventListener('popstate', (event) => {
            if (event.state) {
                const targetDepth = event.state.depth || 0;
                const targetCategory = event.state.category || 'mock';

                if (targetCategory !== currentCategoryGlobal) {
                    currentCategoryGlobal = targetCategory;
                    const activeTabElement = document.getElementById(`tab-${targetCategory}`);
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); 
                    if(activeTabElement) activeTabElement.classList.add('active');
                }

                while (navStack.length > targetDepth) {
                    navStack.pop();
                }
                
                const urlParams = new URLSearchParams(window.location.search);
                const currentExamKey = urlParams.get('exam');
                if (currentExamKey) {
                    sessionStorage.setItem(`saved_nav_${currentExamKey}`, JSON.stringify({ category: currentCategoryGlobal, navStack: navStack }));
                }

                renderCurrentFolderLevel();
            } else {
                navStack = [];
                renderCurrentFolderLevel();
            }
        });

        if (new URLSearchParams(window.location.search).get('exam')) {
            history.replaceState({ category: 'mock', depth: 0 }, "");
        }

        document.getElementById('tab-mock').addEventListener('click', (e) => loadList('mock', e.target)); 
        document.getElementById('tab-pyp').addEventListener('click', (e) => loadList('pyp', e.target)); 
        document.getElementById('tab-subject').addEventListener('click', (e) => loadList('subject', e.target)); 
        document.getElementById('tab-current').addEventListener('click', (e) => loadList('current', e.target)); 
    </script>
<script src="pwa-helper.js"></script>
</body>
</html>
